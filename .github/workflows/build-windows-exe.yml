name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow -r requirements.txt

      - name: Sanity check the timezone database
        run: python -c "import zoneinfo; print(zoneinfo.ZoneInfo('Europe/Kyiv'))"

      - name: UI smoke test (fonts + settings window)
        timeout-minutes: 6
        run: python -u .github/scripts/ui_smoke_test.py screenshots

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Publish screenshots to the PR branch (debug)
        id: publish
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -o pipefail
          .github/scripts/publish_screenshots.sh 2>&1 | tee publish.log

      - name: Report UI failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f screenshots/failure.txt ]; then
            {
              echo 'UI smoke test failed on Windows. Traceback:'
              echo '```'
              cat screenshots/failure.txt
              echo '```'
            } > /tmp/report.md
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/report.md
          fi

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name DesktopClock
          --icon assets/icon.ico
          --add-data "assets/icon.ico;assets"
          --add-data "assets/icon.png;assets"
          --add-data "assets/fonts;assets/fonts"
          --copy-metadata tzdata
          --collect-data tzdata
          clock_widget.py

      - name: Show artifact size
        run: dir dist

      - uses: actions/upload-artifact@v5
        with:
          name: DesktopClock-windows-x64
          path: dist/DesktopClock.exe
          if-no-files-found: error

      - name: Attach the exe to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopClock.exe
          generate_release_notes: true
